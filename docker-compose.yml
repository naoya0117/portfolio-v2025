# vim: set filetype=yaml.docker-compose :
services:
  www:
    build:
      context: './www'
      dockerfile: 'dev.Dockerfile'
      args:
        - 'UID=${UID:-1000}'
        - 'GID=${GID:-1000}'
    ports:
      - '3000:3000'
    volumes:
      - './www:/www'
    depends_on:
      - api
    environment:
      - 'NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}'

  admin:
    build:
      context: './admin'
      dockerfile: 'dev.Dockerfile'
      args:
        - 'UID=${UID:-1000}'
        - 'GID=${GID:-1000}'
    ports:
      - '8000:8000'
    volumes:
      - './admin:/admin'
    depends_on:
      - api
    environment:
      - 'NEXT_PUBLIC_API_URL=http://localhost:8080'

  api:
    build:
      context: './api'
      dockerfile: 'dev.Dockerfile'
      args:
        - 'UID=${UID:-1000}'
        - 'GID=${GID:-1000}'
    ports:
      - '8080:8080'
    volumes:
      - './api:/api'
    environment:
      - 'PORT=${PORT:-8080}'
      - 'GO_ENV=${GO_ENV:-development}'
      - 'DB_HOST=${DB_HOST:-db}'
      - 'DB_PORT=${DB_PORT:-5432}'
      - 'DB_USER=${DB_USER:-postgres}'
      - 'DB_PASSWORD=${DB_PASSWORD:-postgres}'
      - 'DB_NAME=${DB_NAME:-portfolio}'
      - 'ADMIN_USERNAME=${ADMIN_USERNAME:-admin}'
      - 'ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}'
      - 'JWT_SECRET=${JWT_SECRET:-default-jwt-secret}'
      - 'CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: 'postgres:17.5'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER:-postgres}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}'
      - 'POSTGRES_DB=${POSTGRES_DB:-portfolio}'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d portfolio" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
